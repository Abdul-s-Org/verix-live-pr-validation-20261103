name: CI
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest --cov=verix.engine --cov-report=term-missing --cov-fail-under=80
      - run: python -m build
      - run: python scripts/smoke_install.py
      - run: python scripts/check_performance.py
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/verix-benchmark.json
            ${{ runner.temp }}/verix-performance.json
