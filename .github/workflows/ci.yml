name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest --cov=verix.engine --cov-report=term-missing --cov-fail-under=80
      - run: python -m build
      - run: |
          python -m venv /tmp/verix-wheel-test
          /tmp/verix-wheel-test/bin/pip install dist/*.whl
          /tmp/verix-wheel-test/bin/verix --help
