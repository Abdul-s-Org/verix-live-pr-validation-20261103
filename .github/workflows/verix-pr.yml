name: Verix PR check
on:
  workflow_call:
    inputs:
      receipt:
        type: string
        default: .verix-receipt.json
      tool-ref:
        type: string
        default: main
permissions:
  contents: read
concurrency:
  group: verix-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  analyze:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted Verix implementation
        uses: actions/checkout@v4
        with:
          repository: abdulwasea89/Verix
          ref: ${{ inputs.tool-ref }}
          path: tool
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ./tool
      - name: Check out PR data (never execute it)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: target
          fetch-depth: 0
          persist-credentials: false
      - name: Analyze receipt against exact revisions
        id: analyze
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RECEIPT: ${{ inputs.receipt }}
        shell: bash
        run: |
          set +e
          verix --repo target ci --receipt "$RECEIPT" --base "$BASE_SHA" --head "$HEAD_SHA" > "$RUNNER_TEMP/verix-report.json"
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "Verix analysis exited with status $status. See the verix-report artifact for evidence and limitations." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: verix-report
          path: ${{ runner.temp }}/verix-report.json
      - name: Enforce result
        env:
          STATUS: ${{ steps.analyze.outputs.status }}
        run: exit "$STATUS"
  comment:
    needs: analyze
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: verix-report
          path: report
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- verix-report -->';
            const current = await github.rest.pulls.get({ ...context.repo, pull_number: context.issue.number });
            const event = context.payload.pull_request;
            if (current.data.head.sha !== event.head.sha || current.data.base.sha !== event.base.sha) {
              core.info('A newer PR revision exists; leaving its report unchanged.');
              return;
            }
            let report;
            try { report = JSON.parse(fs.readFileSync('report/verix-report.json', 'utf8')); }
            catch { report = { verdict: 'unresolved' }; }
            const allowed = ['allow', 'verify', 'block', 'unresolved'];
            const verdict = allowed.includes(report.verdict) ? report.verdict : 'unresolved';
            const mode = report.mode === 'blocking' ? 'blocking' : 'advisory';
            const body = `${marker}\n### Verix: ${verdict}\nMode: ${mode}. Inspect the workflow artifact for files, revisions, and resolving checks.\nReceipts are self-reported; hidden dependencies are not covered.\n[View run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`;
            const comments = await github.paginate(github.rest.issues.listComments, { ...context.repo, issue_number: context.issue.number });
            const previous = comments.find(c => c.user.type === 'Bot' && c.body?.startsWith(marker));
            if (previous) await github.rest.issues.updateComment({ ...context.repo, comment_id: previous.id, body });
            else await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
