[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "verix"
version = "0.1.0"
description = "A local-first stale-assumption guard for coding agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["PyYAML>=6,<7"]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6", "pytest-cov>=5", "ruff>=0.9", "build>=1"]

[project.scripts]
verix = "verix.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.setuptools.package-data]
verix = ["*.json"]
